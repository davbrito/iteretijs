# Comments on PRs with the changeset status (what will be released, or a link to add a changeset).
# Non-blocking: not every change needs a release. See https://changesets.dev/guide/automating

name: Changeset status

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-status:
    # Forks and Dependabot get a read-only token, so they can't comment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - id: status
        uses: changesets/action/pr-status@v2
      - uses: changesets/action/pr-comment@v2
        with:
          body: ${{ steps.status.outputs.comment-body }}
